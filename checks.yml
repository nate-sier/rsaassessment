name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile scripts
        run: python -m compileall -q app.py manual_review_app.py statsports_backend_v22.py chronological_peak_review.py export_name_override.py workspace_portability.py
      - name: Run unit tests
        run: python -m pytest -q tests
